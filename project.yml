name: EyeSaver
options:
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: "1.0"
targets:
  EyeSaver:
    type: application
    platform: macOS
    sources:
      - App/Host
      - App/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.eyesaver.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        PROVISIONING_PROFILE_SPECIFIER: $(HOST_PROFILE_SPECIFIER)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Eye Saver
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
    dependencies:
      - target: EyeSaverControl
        embed: true
    postCompileScripts:
      - name: Embed monitor helper
        script: |
          install -m 755 "$DDC_HELPER_PATH" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/ddc-key"
          timestamp=--timestamp=none
          if [ "${SIGNING_TIMESTAMP:-0}" = "1" ]; then timestamp=--timestamp; fi
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --options runtime "$timestamp" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/ddc-key"
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$SRCROOT/Vendor/AppleSiliconDDC/LICENSE" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AppleSiliconDDC-LICENSE.txt"
        inputFiles:
          - $(DDC_HELPER_PATH)
          - $(SRCROOT)/Vendor/AppleSiliconDDC/LICENSE
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/ddc-key
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppleSiliconDDC-LICENSE.txt
  EyeSaverControl:
    type: app-extension
    platform: macOS
    sources:
      - App/Control
      - App/Shared
      - App/Host/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.eyesaver.app.control
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Control/Control.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(CONTROL_PROFILE_SPECIFIER)
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: App/Control/Info.plist
      properties:
        CFBundleDisplayName: Eye Saver
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  EyeSaver:
    build:
      targets:
        EyeSaver: all
